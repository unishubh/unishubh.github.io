name: Deploy to GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Copy preserved calculators and assets to dist
        run: |
          cp -n aboutus.html contactus.html disclaimer-page.html disclaimer.html privacy-policy.html terms-and-conditions.html index_classic.html delay_classic.html wealth_classic.html lumpsum_classic.html emi_classic.html hv_classic.html header.html footer.html socialMedia.html share.html sponsor.html style.css dist/ 2>/dev/null || true
          cp -rn js/ dist/js/ 2>/dev/null || true
          cp -n *.png *.jpg dist/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
