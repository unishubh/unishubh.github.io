<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="220" fill="url(#glowGrad)" />

  <!-- Calculator frame -->
  <g transform="translate(110, 120)">
    <rect x="0" y="0" width="160" height="250" rx="24" fill="#1e293b" stroke="#334155" stroke-width="4" />
    
    <!-- Screen -->
    <rect x="16" y="20" width="128" height="60" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2" stroke-opacity="0.6" />
    <text x="130" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#34d399" text-anchor="end">₹ 1.25 Cr</text>

    <!-- Keypad grid dots -->
    <circle cx="42" cy="112" r="12" fill="#334155" />
    <circle cx="80" cy="112" r="12" fill="#334155" />
    <circle cx="118" cy="112" r="12" fill="#334155" />

    <circle cx="42" cy="154" r="12" fill="#334155" />
    <circle cx="80" cy="154" r="12" fill="#334155" />
    <circle cx="118" cy="154" r="12" fill="#334155" />

    <circle cx="42" cy="196" r="12" fill="#334155" />
    <circle cx="80" cy="196" r="12" fill="#334155" />
    <circle cx="118" cy="196" r="12" fill="#10b981" />
  </g>

  <!-- Upward growth arrow curve -->
  <path d="M 80 390 C 170 380, 240 330, 360 160" fill="none" stroke="url(#arrowGrad)" stroke-width="22" stroke-linecap="round" filter="url(#shadow)" />
  <!-- Arrowhead -->
  <polygon points="340,130 405,145 385,210" fill="#34d399" filter="url(#shadow)" />
</svg>
